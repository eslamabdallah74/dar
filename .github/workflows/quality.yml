name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP (format, dead code, static analysis, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        # Matches the DB_* values in phpunit.xml, so no overrides are needed.
        env:
          MYSQL_ROOT_PASSWORD: pass@word
          MYSQL_DATABASE: rental_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppass@word"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, gd, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Feature tests render Inertia pages, which need the Vite manifest.
      - name: Build frontend assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Formatting (Laravel Pint)
        run: composer format:check

      - name: Dead code (Rector)
        run: composer refactor:check

      - name: Static analysis (PHPStan + Larastan)
        run: composer analyse -- --error-format=github

      - name: Tests (Pest)
        run: composer test

  frontend:
    name: Frontend (ESLint, vue-tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # tsconfig maps ziggy-js into vendor/, so the type check needs the PHP dependencies.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Lint (unused code and Vue errors fail the build)
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck
